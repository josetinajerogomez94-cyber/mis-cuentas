<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Cuentas">
<meta name="theme-color" content="#eef2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1412" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Mis Cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna para móvil, cabecera con el mes, pestañas fijas abajo, hojas que suben para añadir */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#f6f8f6; --line:#dde4df;
  --ink:#14211b; --muted:#5b6a62; --faint:#8a978f;
  --accent:#1e6a4e; --accent-ink:#ffffff; --accent-soft:#dcefe6;
  --s1:#2a78d6; --s2:#eb6834;
  --good:#1a7f4b; --warn:#a86400; --bad:#c23b3a; --warn-soft:#fbefd9; --bad-soft:#fbe3e2;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Inter", -apple-system, system-ui, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#172019; --surface-2:#1d2721; --line:#2a3630;
  --ink:#e5ece8; --muted:#a3b1a9; --faint:#7b8a82;
  --accent:#5cc49a; --accent-ink:#0b1a13; --accent-soft:#1f3a2e;
  --s1:#3987e5; --s2:#d95926;
  --good:#5cc49a; --warn:#e2a64a; --bad:#ef7b7a; --warn-soft:#3a2e17; --bad-soft:#3d2222;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#172019; --surface-2:#1d2721; --line:#2a3630;
  --ink:#e5ece8; --muted:#a3b1a9; --faint:#7b8a82;
  --accent:#5cc49a; --accent-ink:#0b1a13; --accent-soft:#1f3a2e;
  --s1:#3987e5; --s2:#d95926;
  --good:#5cc49a; --warn:#e2a64a; --bad:#ef7b7a; --warn-soft:#3a2e17; --bad-soft:#3d2222;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.month button:hover{background:var(--surface-2)}
.month span{min-width:84px;text-align:center;font-weight:600;font-size:14px;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--muted);display:grid;place-items:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner b{display:block}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn.small{padding:7px 11px;font-size:13px}

.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.card h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 12px;letter-spacing:-.005em}
.card h2 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .label{color:inherit;opacity:.8}
.hero .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 2px}
.hero .sub{opacity:.85;font-size:14px}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.flow div{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:10px;padding:8px 10px}
.flow b{display:block;font-size:16px;font-weight:600}
.flow span{font-size:12px;opacity:.85}
.meter{height:8px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);overflow:hidden;display:flex;gap:2px;margin-top:14px}
.meter i{display:block;height:100%;background:var(--accent-ink)}
.meter i.v{opacity:.55}

.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.cat .n{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .v{font-weight:600}
.cat .bar{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.cat .pct{color:var(--muted);font-weight:400;font-size:13px;margin-right:6px}

.hist{position:relative}
.hist svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%)}

.insights{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.insights li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;flex:none;margin-top:2px}
.pill.up{background:var(--bad-soft);color:var(--bad)}
.pill.down{background:var(--accent-soft);color:var(--good)}
.pill.info{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

.list{display:flex;flex-direction:column}
.day{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:12px 0 4px}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.row .t{min-width:0}
.row .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font-size:13px;color:var(--muted)}
.row .a{font-weight:600;text-align:right}
.row .a small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.prog{height:5px;background:var(--surface-2);border-radius:99px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
.totrow{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:4px;border-top:1px solid var(--line);font-weight:600}

.savebig{font-family:var(--display);font-size:36px;font-weight:700;letter-spacing:-.02em}
.goal{margin-top:10px}
.goal .prog{height:8px}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:5px;border:1px solid var(--line);word-break:break-all}
.note{font-size:13px;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--faint);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .add{justify-self:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);padding:0;justify-content:center;margin-top:-18px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
nav.tabs .add svg{width:26px;height:26px}

.sheet-wrap{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 40%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{font-family:var(--display);margin:0 0 14px;font-size:20px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f label{font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 12px;width:100%;min-width:0;font-size:16px}
.f textarea{min-height:110px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px}
.amount-in{font-family:var(--display)!important;font-size:30px!important;font-weight:700;text-align:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:6px;flex-wrap:wrap}
.actions .r{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.sync{font-size:12px;color:var(--faint);text-align:center;margin-top:8px}

html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
.app{padding-top:max(12px,env(safe-area-inset-top,0px))!important}
.bk{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">Mis Cuentas</div>
    <div class="month" aria-label="Mes">
      <button id="prevM" aria-label="Mes anterior">‹</button>
      <span id="monthLbl" class="num">—</span>
      <button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
    <button class="iconbtn" id="openSettings" aria-label="Ajustes">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div id="demoBanner" class="banner" hidden>
    <div><b>Estás viendo datos de ejemplo</b>Cuando empieces, se borran y la app se queda con tus gastos fijos para que pongas los importes.</div>
    <button class="btn small" id="startReal">Empezar con mis datos</button>
  </div>

  <main id="view" class="view"></main>
  <div class="sync" id="syncNote"></div>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-tab="resumen" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Resumen</button>
    <button data-tab="gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Gastos</button>
    <button class="add" id="addBtn" aria-label="Añadir gasto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="fijos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Fijos</button>
    <button data-tab="ahorro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7h-2.5A5.5 5.5 0 0 0 6 9.5V10H4v4h2.2A6.5 6.5 0 0 0 9 17v3h3v-2h2v2h3v-3.4A5.5 5.5 0 0 0 20 12V8z"/><circle cx="15" cy="10" r=".6" fill="currentColor"/></svg>Ahorro</button>
  </div>
</nav>

<div id="sheetRoot"></div>

<script>
(() => {
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Math.round(n*100)/100).toLocaleString("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = n => Math.round(n).toLocaleString("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const ym = d => d.slice(0,7);
const todayISO = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const addMonths = (k,n) => { let [y,m]=k.split("-").map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+"-"+String(m).padStart(2,"0"); };
const monthName = k => { const [y,m]=k.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("es-ES",{month:"long",year:"numeric"}); };
const monthShort = k => { const [y,m]=k.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("es-ES",{month:"short"}).replace(".",""); };
const monthsBetween = (a,b) => { const [y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number); return (y2-y1)*12+(m2-m1); };
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hash = s => { let h=5381; for (let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); };
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();

const CATS = ["Supermercado","Restaurantes","Transporte","Gasolina","Compras","Ocio","Salud","Hogar","Suscripciones","Seguros","Préstamos","Autónomo","Otros"];
const KEYWORDS = {
  Supermercado:["mercadona","carrefour","lidl","dia ","dia%","alcampo","eroski","aldi","consum","hipercor","ahorramas","bonpreu","supermerc","bm "],
  Restaurantes:["restaur","bar ","cafe","cafeteria","mcdonald","burger","kfc","telepizza","domino","glovo","just eat","uber eats","starbucks","100 montaditos","foster","goiko","vips","tagliatella"],
  Transporte:["uber","cabify","bolt","renfe","metro","emt","tmb","alsa","blablacar","iberia","vueling","ryanair","parking","aparcamiento","autopista","peaje"],
  Gasolina:["repsol","cepsa","bp ","galp","shell","petronor","plenoil","ballenoil","gasolin"],
  Compras:["amazon","zara","primark","decathlon","el corte ingles","ikea","mediamarkt","pccomponentes","aliexpress","shein","h&m","mango","fnac"],
  Ocio:["cine","yelmo","cinesa","ticketmaster","steam","playstation","nintendo","xbox","gimnasio","gym","basic-fit"],
  Salud:["farmacia","dentist","clinica","optica","hospital","fisio"],
  Hogar:["leroy","bricomart","endesa","iberdrola","naturgy","aguas","movistar","vodafone","orange","digi","masmovil"],
  Suscripciones:["spotify","netflix","hbo","max ","disney","prime video","apple.com","icloud","youtube","chatgpt","claude","dazn"]
};
const ABBR = c => ({Supermercado:"SUP",Restaurantes:"RES",Transporte:"TRA",Gasolina:"GAS",Compras:"COM",Ocio:"OCI",Salud:"SAL",Hogar:"HOG",Suscripciones:"SUS",Seguros:"SEG","Préstamos":"PRE","Autónomo":"AUT",Otros:"OTR"}[c]||"·");

/* ---------- estado ---------- */
const state = { mode:"loading", config:null, fijos:{}, gastos:{}, ahorros:{}, tab:"resumen", month: todayISO().slice(0,7) };
try { const t = localStorage.getItem("mc.tab"); if (t) state.tab = t; } catch(e){}

/* Datos de ejemplo (no son tuyos) */
function demoData(){
  const cur = todayISO().slice(0,7), prev = addMonths(cur,-1), prev2 = addMonths(cur,-2);
  const g = {}; let i=0;
  const add = (m,d,imp,com,cat) => { g["d"+(i++)] = {fecha:`${m}-${String(d).padStart(2,"0")}`, importe:imp, comercio:com, categoria:cat, origen:"ejemplo"}; };
  const day = Math.min(Number(todayISO().slice(8,10)), 28);
  [[1,62.4,"Mercadona","Supermercado"],[2,14.5,"Bar La Plaza","Restaurantes"],[3,55,"Repsol","Gasolina"],[5,23.9,"Amazon","Compras"],[6,38.2,"Lidl","Supermercado"],[8,31,"Glovo","Restaurantes"],[9,12.4,"Farmacia Centro","Salud"],[11,71.3,"Mercadona","Supermercado"],[12,9.9,"Cinesa","Ocio"],[14,48,"Repsol","Gasolina"],[15,26.5,"Goiko","Restaurantes"],[17,44.1,"Carrefour","Supermercado"],[19,18,"Renfe","Transporte"]]
    .filter(r=>r[0]<=day).forEach(r=>add(cur,...r));
  [[2,58.1,"Mercadona","Supermercado"],[4,52,"Repsol","Gasolina"],[6,42,"Zara","Compras"],[9,22.3,"Bar La Plaza","Restaurantes"],[10,66.7,"Mercadona","Supermercado"],[13,35,"Glovo","Restaurantes"],[16,50,"Cepsa","Gasolina"],[18,39.4,"Lidl","Supermercado"],[21,64,"Restaurante El Puerto","Restaurantes"],[24,72.5,"Mercadona","Supermercado"],[27,19.9,"Steam","Ocio"]].forEach(r=>add(prev,...r));

/* ---------- almacenamiento: db (si está disponible) o este navegador ---------- */
let store = null; // {set(col,id,data), del(col,id), setConfig(data)}
const LS = "mc.data.v1";
function localStore(){
  const save = () => { try { localStorage.setItem(LS, JSON.stringify({config:state.config,fijos:state.fijos,gastos:state.gastos,ahorros:state.ahorros})); } catch(e){} };
  return {
    kind:"local",
    async set(col,id,data){ state[col] = {...state[col],[id]:data}; save(); render(); },
    async del(col,id){ const c={...state[col]}; delete c[id]; state[col]=c; save(); render(); },
    async setConfig(data){ state.config = data; save(); render(); },
    async wipe(){ state.fijos={}; state.gastos={}; state.ahorros={}; save(); }
  };
}
function loadLocal(){
  try { const raw = localStorage.getItem(LS); if (raw){ const d=JSON.parse(raw); Object.assign(state,{config:d.config,fijos:d.fijos||{},gastos:d.gastos||{},ahorros:d.ahorros||{}}); return true; } } catch(e){}
  return false;
}

async function boot(){
  render();
  let db=null, uid=null;
  try {
    db = null; try{ navigator.storage?.persist?.(); }catch(e){}
    const user = db ? await window.claude.use("user") : null;
    uid = user ? await user.id() : null;
  } catch(e){ db=null; }
  if (db && uid){
    const base = db.doc("data/users/"+uid+"/cuentas");
    const cols = {fijos:base.collection("fijos"), gastos:base.collection("gastos"), ahorros:base.collection("ahorros")};
    store = {
      kind:"db",
      async set(col,id,data){ await cols[col].doc(id).set(data); },
      async del(col,id){ await cols[col].doc(id).delete(); },
      async setConfig(data){ await base.set(data); },
      async wipe(){ for (const col of Object.keys(cols)) for (const id of Object.keys(state[col])) await cols[col].doc(id).delete(); }
    };
    let gotConfig=false;
    const timer = setTimeout(()=>{ if(!gotConfig){ $("#syncNote").textContent="No se pueden cargar tus datos todavía. Reintentando…"; } }, 10000);
    const fail = e => { $("#syncNote").textContent = "No se pudo sincronizar ("+(e?.code||"error")+")."; };
    base.onSnapshot(s => {
      if (!s.metadata.fromCache){ gotConfig=true; clearTimeout(timer); $("#syncNote").textContent="Guardado en tu cuenta de Claude · privado"; }
      state.config = s.exists ? s.data() : null;
      if (!s.exists && !s.metadata.fromCache) state.mode="demo"; else if (s.exists) state.mode="real";
      render();
    }, fail);
    for (const [k,ref] of Object.entries(cols)){
      ref.onSnapshot(qs => { const o={}; qs.docs.forEach(d=>o[d.id]=d.data()); state[k]=o; render(); }, fail);
    }
  } else {
    store = localStore();
    state.mode = loadLocal() && state.config ? "real" : "demo";
    $("#syncNote").textContent = state.mode==="real" ? "Guardado en este iPhone · haz una copia de vez en cuando en Ajustes" : "";
    render();
  }
}

/* vista efectiva: demo o datos reales */
function data(){
  if (state.mode==="real") return {config:state.config||{}, fijos:state.fijos, gastos:state.gastos, ahorros:state.ahorros};
  return demoData();
}
const readOnly = () => state.mode!=="real";

/* ---------- cálculos ---------- */
function fijoEnMes(f, m){
  if (f.frecuencia==="anual"){ if (Number(m.slice(5,7)) !== Number(f.mesAnual||1)) return null; }
  if (f.cuotas && f.inicio){
    const k = monthsBetween(f.inicio, m);
    if (k<0 || k>=f.cuotas) return null;
    return {cuota:k+1, de:f.cuotas};
  }
  return {};
}
function resumenMes(d, m){
  const fijos = Object.entries(d.fijos).map(([id,f])=>({id,...f,en:fijoEnMes(f,m)})).filter(f=>f.en);
  const gastos = Object.entries(d.gastos).map(([id,g])=>({id,...g})).filter(g=>ym(g.fecha)===m);
  const tf = fijos.reduce((a,f)=>a+(+f.importe||0),0);
  const tv = gastos.reduce((a,g)=>a+(+g.importe||0),0);
  const porCat = {};
  fijos.forEach(f=>porCat[f.categoria||"Otros"]=(porCat[f.categoria||"Otros"]||0)+(+f.importe||0));
  gastos.forEach(g=>porCat[g.categoria||"Otros"]=(porCat[g.categoria||"Otros"]||0)+(+g.importe||0));
  return {fijos,gastos,tf,tv,total:tf+tv,porCat,ingresos:+d.config.nomina||0};
}
function categorize(comercio, d){
  const n = norm(comercio);
  const reglas = (d||data()).config.reglas || {};
  if (reglas[n]) return reglas[n];
  for (const [cat,kws] of Object.entries(KEYWORDS)) if (kws.some(k=>(" "+n+" ").includes(k.replace("%"," ")) || n.startsWith(k.trim()))) return cat;
  return "Otros";
}
function saldoActual(a){ const h=(a.historial||[]).slice().sort((x,y)=>x.fecha<y.fecha?-1:1); return h.length?h[h.length-1].saldo:0; }

/* ---------- render ---------- */
function render(){
  { const [yy,mm]=state.month.split("-").map(Number); const s=new Date(yy,mm-1,1).toLocaleDateString("es-ES",{month:"short"}).replace(".",""); $("#monthLbl").textContent = s.charAt(0).toUpperCase()+s.slice(1)+" "+yy; }
  $("#demoBanner").hidden = state.mode!=="demo";
  document.querySelectorAll("nav.tabs [data-tab]").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===state.tab?"page":"false"));
  const v = $("#view");
  if (state.mode==="loading"){ v.innerHTML = `<div class="card empty">Cargando tus cuentas…</div>`; return; }
  const d = data();
  v.innerHTML = ({resumen:viewResumen, gastos:viewGastos, fijos:viewFijos, ahorro:viewAhorro, atajo:viewAtajo}[state.tab]||viewResumen)(d);
  bindView();
}

function viewResumen(d){
  const r = resumenMes(d, state.month);
  const prev = resumenMes(d, addMonths(state.month,-1));
  const queda = r.ingresos - r.total;
  const pf = r.ingresos? Math.min(100, r.tf/r.ingresos*100):0, pv = r.ingresos? Math.min(100-pf, r.tv/r.ingresos*100):0;
  const cats = Object.entries(r.porCat).sort((a,b)=>b[1]-a[1]);
  const max = cats.length? cats[0][1]:1;
  // insights
  const ins = [];
  const prevCat = prev.porCat;
  cats.slice(0,6).forEach(([c,v])=>{
    const p = prevCat[c]||0; if (p>20){ const dlt=(v-p)/p*100; if (Math.abs(dlt)>=20) ins.push(dlt>0?`<li><span class="pill up">+${Math.round(dlt)}%</span><span>${esc(c)}: ${fmt(v)} este mes frente a ${fmt(p)} el mes pasado.</span></li>`:`<li><span class="pill down">${Math.round(dlt)}%</span><span>${esc(c)}: has gastado ${fmt(p-v)} menos que el mes pasado.</span></li>`); }
  });
  const anuales = Object.values(d.fijos).filter(f=>f.frecuencia==="anual");
  if (anuales.length){ const res = anuales.reduce((a,f)=>a+(+f.importe||0),0)/12; ins.push(`<li><span class="pill info">Anual</span><span>Aparta ${fmt(res)} al mes para pagos anuales (${anuales.map(f=>esc(f.nombre)).join(", ")}).</span></li>`); }
  const sinImporte = Object.values(d.fijos).filter(f=>!(+f.importe));
  if (sinImporte.length) ins.push(`<li><span class="pill warn">Falta</span><span>Pon el importe de: ${sinImporte.map(f=>esc(f.nombre)).join(", ")}.</span></li>`);
  const subs = r.fijos.filter(f=>f.categoria==="Suscripciones").reduce((a,f)=>a+(+f.importe||0),0);
  if (subs) ins.push(`<li><span class="pill info">Subs</span><span>Tus suscripciones suman ${fmt(subs)} al mes (${fmt(subs*12)} al año).</span></li>`);
  // ahorro
  const totalAhorro = Object.values(d.ahorros).reduce((a,x)=>a+saldoActual(x),0);
  return `
  <section class="card hero">
    <div class="label">Te queda este mes</div>
    <div class="big num">${fmt(queda)}</div>
    <div class="sub">${r.ingresos? `de ${fmt(r.ingresos)} de nómina · has gastado el ${Math.round(r.total/r.ingresos*100)}%` : "Añade tu nómina en Ajustes"}</div>
    <div class="meter" aria-hidden="true"><i style="width:${pf}%"></i><i class="v" style="width:${pv}%"></i></div>
    <div class="flow">
      <div><b class="num">${fmt0(r.tf)}</b><span>Fijos</span></div>
      <div><b class="num">${fmt0(r.tv)}</b><span>Día a día</span></div>
      <div><b class="num">${fmt0(totalAhorro)}</b><span>Ahorrado</span></div>
    </div>
  </section>

  <section class="card">
    <h2>¿En qué se va?<small>${fmt(r.total)} en total</small></h2>
    ${cats.length? `<div class="cats">${cats.map(([c,v])=>`<div class="cat"><span class="n">${esc(c)}</span><span class="v num"><span class="pct">${Math.round(v/r.total*100)}%</span>${fmt(v)}</span><div class="bar"><i style="width:${Math.max(2,v/max*100)}%"></i></div></div>`).join("")}</div>` : `<div class="empty">Sin gastos este mes todavía.</div>`}
  </section>

  ${ins.length? `<section class="card"><h2>Lo que deberías saber</h2><ul class="insights">${ins.join("")}</ul></section>`:""}

  <section class="card">
    <h2>Últimos 6 meses</h2>
    <div class="legend"><span><i style="background:var(--s1)"></i>Fijos</span><span><i style="background:var(--s2)"></i>Día a día</span></div>
    ${histChart(d)}
  </section>`;
}

function histChart(d){
  const ms = [...Array(6)].map((_,i)=>addMonths(state.month,i-5));
  const rows = ms.map(m=>{ const r=resumenMes(d,m); return {m,f:r.tf,v:r.tv}; });
  const W=320,H=150,pl=36,pb=20,pt=8, iw=W-pl-6, ih=H-pb-pt;
  const mx = Math.max(100,...rows.map(r=>r.f+r.v));
  const step = mx>2000?500:mx>800?200:mx>300?100:50;
  const top = Math.ceil(mx/step)*step;
  const y = v => pt+ih-(v/top*ih);
  const bw = iw/rows.length*0.56;
  let g = "";
  for (let t=0;t<=top;t+=step){ g+=`<line x1="${pl}" x2="${W-6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+3.5}" text-anchor="end" font-size="9.5" fill="var(--faint)">${t>=1000?(t/1000)+"k":t}</text>`; }
  rows.forEach((r,i)=>{
    const cx = pl + iw/rows.length*(i+.5), x = cx-bw/2;
    const hf = r.f/top*ih, hv = r.v/top*ih;
    const cur = r.m===state.month;
    if (hf>0) g+=`<rect x="${x}" y="${y(r.f)}" width="${bw}" height="${hf}" fill="var(--s1)" ${hv>0?"":'rx="3"'}/>`;
    if (hv>2) g+=`<rect x="${x}" y="${y(r.f+r.v)}" width="${bw}" height="${hv-2}" rx="3" fill="var(--s2)"/>`;
    g+=`<text x="${cx}" y="${H-5}" text-anchor="middle" font-size="10" fill="${cur?"var(--ink)":"var(--muted)"}" font-weight="${cur?600:400}">${monthShort(r.m)}</text>`;
    g+=`<rect x="${cx-iw/rows.length/2}" y="${pt}" width="${iw/rows.length}" height="${ih}" fill="transparent" data-tip="${esc(monthName(r.m))}|${fmt(r.f)}|${fmt(r.v)}|${fmt(r.f+r.v)}"/>`;
  });
  return `<div class="hist"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto de los últimos 6 meses">${g}</svg><div class="tip" hidden></div></div>`;
}

function viewGastos(d){
  const r = resumenMes(d, state.month);
  const gs = r.gastos.sort((a,b)=>a.fecha<b.fecha?1:-1);
  let html = "", lastDay="";
  gs.forEach(g=>{
    if (g.fecha!==lastDay){ lastDay=g.fecha; const [y,m,dd]=g.fecha.split("-").map(Number); html+=`<div class="day">${new Date(y,m-1,dd).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short"})}</div>`; }
    html+=`<button class="row" data-edit-gasto="${esc(g.id)}"><span class="ico">${ABBR(g.categoria)}</span><span class="t"><b>${esc(g.comercio||"Sin nombre")}</b><span>${esc(g.categoria)}${g.origen==="atajo"?" · desde el atajo":""}</span></span><span class="a num">−${fmt(g.importe)}</span></button>`;

  return `

  </section>`;
}

function viewFijos(d){
  const m = state.month;
  const fs = Object.entries(d.fijos).map(([id,f])=>({id,...f,en:fijoEnMes(f,m)})).sort((a,b)=>(a.dia||0)-(b.dia||0));
  const total = fs.filter(f=>f.en).reduce((a,f)=>a+(+f.importe||0),0);
  const row = f => {
    let sub = `Día ${f.dia||"?"} · ${esc(f.categoria)}`;
    let extra = "";
    if (f.frecuencia==="anual") sub += ` · anual, en ${new Date(2000,(f.mesAnual||1)-1,1).toLocaleDateString("es-ES",{month:"long"})}`;
    if (f.cuotas && f.inicio){
      const hechas = Math.max(0, Math.min(f.cuotas, monthsBetween(f.inicio, m)+1));
      const quedan = f.cuotas-hechas;
      sub += quedan>0 ? ` · quedan ${quedan} cuotas (${fmt(quedan*f.importe)})` : " · terminado";
      extra = `<div class="prog"><i style="width:${hechas/f.cuotas*100}%"></i></div>`;
    }
    const amt = +f.importe ? `−${fmt(f.importe)}` : `<span class="pill warn">Pon importe</span>`;
    return `<button class="row" data-edit-fijo="${esc(f.id)}" style="${f.en?"":"opacity:.55"}"><span class="ico">${ABBR(f.categoria)}</span><span class="t"><b>${esc(f.nombre)}</b><span>${sub}</span>${extra}</span><span class="a num">${amt}${f.en?"":"<small>no toca este mes</small>"}</span></button>`;
  };
  return `
  <section class="card">
    <h2>Gastos fijos<small>salen de tu cuenta de la nómina</small></h2>
    <div class="list">${fs.map(row).join("") || `<div class="empty">Añade tus gastos fijos: Spotify, seguro, plazos…</div>`}</div>
    <div class="totrow"><span>Total en ${esc(monthName(m))}</span><span class="num">${fmt(total)}</span></div>
  </section>
  <button class="btn" id="addFijo">Añadir gasto fijo</button>`;
}

function viewAhorro(d){
  const as = Object.entries(d.ahorros).map(([id,a])=>({id,...a}));
  const total = as.reduce((a,x)=>a+saldoActual(x),0);
  const card = a => {
    const h = (a.historial||[]).slice().sort((x,y)=>x.fecha<y.fecha?-1:1);
    const s = saldoActual(a);
    const first = h.length? h[0].saldo:0;
    const ultimo = h.length>1 ? s - h[h.length-2].saldo : 0;
    const goal = +a.objetivo ? `<div class="goal"><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>Objetivo ${fmt0(a.objetivo)}</span><span class="num">${Math.min(100,Math.round(s/a.objetivo*100))}%</span></div><div class="prog"><i style="width:${Math.min(100,s/a.objetivo*100)}%"></i></div></div>`:"";
    return `<section class="card">
      <div class="label">${esc(a.nombre)}</div>
      <div class="savebig num">${fmt(s)}</div>
      <div class="note">${h.length>1? `${ultimo>=0?"+":"−"}${fmt(Math.abs(ultimo))} desde la última vez · ${s>=first?"+":"−"}${fmt(Math.abs(s-first))} desde ${new Date(h[0].fecha).toLocaleDateString("es-ES",{month:"long",year:"numeric"})}`:"Actualiza el saldo cada mes para ver cómo crece."}</div>
      ${goal}
      ${h.length>1? spark(h):""}
      <div class="actions"><button class="btn ghost small" data-edit-ahorro="${esc(a.id)}">Editar</button><button class="btn small" data-saldo="${esc(a.id)}">Actualizar saldo</button></div>
    </section>`;
  };
  return `
  ${as.length>1?`<section class="card"><div class="label">Total ahorrado</div><div class="savebig num">${fmt(total)}</div></section>`:""}
  ${as.map(card).join("") || `<section class="card empty">Añade tu cuenta de ahorro, por ejemplo la cuenta remunerada de Revolut.</section>`}
  <button class="btn" id="addAhorro">Añadir cuenta de ahorro</button>`;
}
function spark(h){
  const W=300,H=64,p=4; const vs=h.map(x=>x.saldo); const mn=Math.min(...vs), mx=Math.max(...vs), rg=(mx-mn)||1;
  const pts = h.map((x,i)=>[p+i*(W-2*p)/(h.length-1), H-p-((x.saldo-mn)/rg)*(H-2*p-6)]);
  const line = pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:12px" aria-hidden="true"><path d="${line} L${last[0]},${H} L${pts[0][0]},${H} Z" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}

  $("#addFijo") && ($("#addFijo").onclick=()=>sheetFijo());
  $("#addAhorro") && ($("#addAhorro").onclick=()=>sheetAhorro());
  $("#importBtn") && ($("#importBtn").onclick=()=>sheetImport());
  const hist = document.querySelector(".hist");
  if (hist){
    const tip = hist.querySelector(".tip");
    hist.querySelectorAll("[data-tip]").forEach(r=>{
      const show = e => { const [m,f,v,t]=r.dataset.tip.split("|"); tip.innerHTML=`<b>${m}</b><br>Fijos ${f}<br>Día a día ${v}<br>Total ${t}`; tip.hidden=false; const hb=hist.getBoundingClientRect(), rb=r.getBoundingClientRect(); tip.style.left=Math.min(hb.width-70,Math.max(70,rb.left-hb.left+rb.width/2))+"px"; tip.style.top=(rb.top-hb.top+20)+"px"; };
      r.addEventListener("pointerenter",show); r.addEventListener("click",show);
      r.addEventListener("pointerleave",()=>tip.hidden=true);
    });
  }
}
function go(tab){ state.tab=tab; try{localStorage.setItem("mc.tab",tab)}catch(e){} render(); window.scrollTo(0,0); }
document.querySelectorAll("nav.tabs [data-tab]").forEach(b=>b.onclick=()=>go(b.dataset.tab));
$("#prevM").onclick=()=>{state.month=addMonths(state.month,-1);render();};
$("#nextM").onclick=()=>{state.month=addMonths(state.month,1);render();};
$("#addBtn").onclick=()=>sheetGasto();
$("#openSettings").onclick=()=>sheetSettings();
$("#startReal").onclick=startReal;

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function needReal(){ if (readOnly()){ toast("Pulsa «Empezar con mis datos» para guardar tus cambios"); return true; } return false; }

async function startReal(){
  if (!store) return;
  const btn=$("#startReal"); btn.disabled=true; btn.textContent="Preparando…";
  try{
    await store.wipe?.();
    await store.setConfig({nomina:0, reglas:{}, creado:todayISO()});
    const cur = todayISO().slice(0,7);
    const base = [
      {nombre:"Spotify",importe:0,dia:1,categoria:"Suscripciones",frecuencia:"mensual"},
      {nombre:"Seguro del coche",importe:0,dia:1,categoria:"Seguros",frecuencia:"anual",mesAnual:Number(cur.slice(5,7))},
      {nombre:"Plazos del PC",importe:0,dia:1,categoria:"Préstamos",frecuencia:"mensual",cuotas:12,inicio:cur},
      {nombre:"Cuota de autónomo",importe:0,dia:30,categoria:"Autónomo",frecuencia:"mensual"}
    ];
    for (const f of base) await store.set("fijos", newId(), f);
    await store.set("ahorros", newId(), {nombre:"Cuenta remunerada Revolut", objetivo:0, historial:[]});
    if (store.kind==="local"){ state.mode="real"; $("#syncNote").textContent="Guardado en este iPhone · haz una copia de vez en cuando en Ajustes"; }
    state.tab="fijos"; render();
    toast("Listo. Pon el importe de cada gasto fijo y tu nómina en Ajustes.");
  }catch(e){ toast("No se pudo empezar: "+(e?.code||e?.message||"error")); btn.disabled=false; btn.textContent="Empezar con mis datos"; }
}

/* ---------- hojas ---------- */
function openSheet(html, onMount){
  const root=$("#sheetRoot");
  root.innerHTML=`<div class="sheet-wrap"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const wrap=root.firstElementChild;
  wrap.addEventListener("click",e=>{ if(e.target===wrap) closeSheet(); });
  wrap.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  onMount && onMount(wrap);
  const f = wrap.querySelector("input,select,textarea"); f && setTimeout(()=>f.focus(),50);
}
function closeSheet(){ $("#sheetRoot").innerHTML=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
const parseAmount = s => { let t=String(s).replace(/[^\d,.\-]/g,""); if (t.includes(",")&&t.includes(".")) t = t.lastIndexOf(",")>t.lastIndexOf(".") ? t.replace(/\./g,"").replace(",",".") : t.replace(/,/g,""); else t=t.replace(",","."); const n=Math.abs(parseFloat(t)); return isFinite(n)?n:NaN; };
const catChips = (sel, name="cat") => `<div class="chips" data-chips="${name}">${CATS.map(c=>`<button type="button" class="chip" aria-pressed="${c===sel}" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
function bindChips(wrap){ wrap.querySelectorAll("[data-chips]").forEach(g=>g.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ g.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false")); c.setAttribute("aria-pressed","true"); })); }
const chipVal = (wrap,name="cat") => wrap.querySelector(`[data-chips="${name}"] [aria-pressed="true"]`)?.dataset.v || "Otros";

function sheetGasto(id){
  const d=data(); const g = id ? d.gastos[id] : {fecha:todayISO(), importe:"", comercio:"", categoria:"Supermercado"};
  openSheet(`<h3>${id?"Editar gasto":"Nuevo gasto"}</h3>
    <form id="fG">
      <div class="f"><label for="gImp">Importe (€)</label><input id="gImp" class="amount-in num" inputmode="decimal" placeholder="0,00" value="${g.importe!==""?String(g.importe).replace(".",","):""}" required></div>
      <div class="grid2">
        <div class="f"><label for="gCom">Comercio</label><input id="gCom" placeholder="Mercadona" value="${esc(g.comercio)}"></div>
        <div class="f"><label for="gFec">Fecha</label><input id="gFec" type="date" value="${esc(g.fecha)}" required></div>
      </div>
      <div class="f"><label>Categoría</label>${catChips(g.categoria)}</div>
      <div class="actions">${id?`<button type="button" class="btn danger" id="gDel">Borrar</button>`:""}<div class="r"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Guardar</button></div></div>
    </form>`, wrap=>{
      bindChips(wrap);
      const com=wrap.querySelector("#gCom");
      com.addEventListener("change",()=>{ if(id) return; const c=categorize(com.value); wrap.querySelectorAll('[data-chips="cat"] .chip').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===c))); });
      wrap.querySelector("#fG").onsubmit=async e=>{ e.preventDefault(); if(needReal()) return;
        const imp=parseAmount(wrap.querySelector("#gImp").value); if(!(imp>0)){ toast("Escribe un importe válido, por ejemplo 12,50"); return; }
        const cat=chipVal(wrap); const comercio=com.value.trim();
        const rec={fecha:wrap.querySelector("#gFec").value, importe:imp, comercio, categoria:cat, origen:id?(g.origen||"manual"):"manual"};
        closeSheet();
        await store.set("gastos", id||newId(), rec);
        if (comercio && categorize(comercio)!==cat){ const cfg={...(state.config||{})}; cfg.reglas={...(cfg.reglas||{}),[norm(comercio)]:cat}; await store.setConfig(cfg); }
        toast(id?"Gasto actualizado":"Gasto añadido");
      };
      const del=wrap.querySelector("#gDel"); del && (del.onclick=async()=>{ if(needReal())return; closeSheet(); await store.del("gastos",id); toast("Gasto borrado"); });
    });
}

function sheetFijo(id){
  const d=data(); const f = id? d.fijos[id] : {nombre:"",importe:"",dia:1,categoria:"Suscripciones",frecuencia:"mensual"};
  const plazos = !!f.cuotas;
  openSheet(`<h3>${id?"Editar gasto fijo":"Nuevo gasto fijo"}</h3>
    <form id="fF">
      <div class="f"><label for="fNom">Nombre</label><input id="fNom" value="${esc(f.nombre)}" placeholder="Spotify" required></div>
      <div class="grid2">
        <div class="f"><label for="fImp">Importe (€)</label><input id="fImp" inputmode="decimal" class="num" value="${+f.importe?String(f.importe).replace(".",","):""}" placeholder="0,00"></div>
        <div class="f"><label for="fDia">Día del cargo</label><input id="fDia" type="number" min="1" max="31" value="${f.dia||1}"></div>
      </div>
      <div class="grid2">
        <div class="f"><label for="fFre">Se paga</label><select id="fFre"><option value="mensual" ${f.frecuencia!=="anual"?"selected":""}>Cada mes</option><option value="anual" ${f.frecuencia==="anual"?"selected":""}>Una vez al año</option></select></div>
        <div class="f" id="fMesW" ${f.frecuencia==="anual"?"":"hidden"}><label for="fMes">Mes del pago</label><select id="fMes">${[...Array(12)].map((_,i)=>`<option value="${i+1}" ${(f.mesAnual||1)==i+1?"selected":""}>${new Date(2000,i,1).toLocaleDateString("es-ES",{month:"long"})}</option>`).join("")}</select></div>
      </div>
      <div class="f"><label><input type="checkbox" id="fPl" ${plazos?"checked":""} style="width:auto;margin-right:6px">Es un pago a plazos</label></div>
      <div class="grid2" id="fPlW" ${plazos?"":"hidden"}>
        <div class="f"><label for="fCuo">Número de cuotas</label><input id="fCuo" type="number" min="1" value="${f.cuotas||12}"></div>
        <div class="f"><label for="fIni">Primera cuota</label><input id="fIni" type="month" value="${esc(f.inicio||todayISO().slice(0,7))}"></div>
      </div>
      <div class="f"><label>Categoría</label>${catChips(f.categoria)}</div>
      <div class="actions">${id?`<button type="button" class="btn danger" id="fDel">Borrar</button>`:""}<div class="r"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Guardar</button></div></div>
    </form>`, wrap=>{
      bindChips(wrap);
      wrap.querySelector("#fFre").onchange=e=>wrap.querySelector("#fMesW").hidden=e.target.value!=="anual";
      wrap.querySelector("#fPl").onchange=e=>wrap.querySelector("#fPlW").hidden=!e.target.checked;
      wrap.querySelector("#fF").onsubmit=async e=>{ e.preventDefault(); if(needReal())return;
        const imp=parseAmount(wrap.querySelector("#fImp").value||"0");
        const rec={nombre:wrap.querySelector("#fNom").value.trim(), importe:isFinite(imp)?imp:0, dia:+wrap.querySelector("#fDia").value||1, categoria:chipVal(wrap), frecuencia:wrap.querySelector("#fFre").value};
        if (rec.frecuencia==="anual") rec.mesAnual=+wrap.querySelector("#fMes").value;
        if (wrap.querySelector("#fPl").checked){ rec.cuotas=+wrap.querySelector("#fCuo").value||1; rec.inicio=wrap.querySelector("#fIni").value||todayISO().slice(0,7); }
        closeSheet(); await store.set("fijos", id||newId(), rec); toast("Gasto fijo guardado");
      };
      const del=wrap.querySelector("#fDel"); del && (del.onclick=async()=>{ if(needReal())return; closeSheet(); await store.del("fijos",id); toast("Gasto fijo borrado"); });
    });
}

function sheetAhorro(id){
  const d=data(); const a = id? d.ahorros[id] : {nombre:"",objetivo:"",historial:[]};
  openSheet(`<h3>${id?"Editar cuenta":"Nueva cuenta de ahorro"}</h3>
    <form id="fA">
      <div class="f"><label for="aNom">Nombre</label><input id="aNom" value="${esc(a.nombre)}" placeholder="Cuenta remunerada Revolut" required></div>
      <div class="f"><label for="aObj">Objetivo (€, opcional)</label><input id="aObj" inputmode="decimal" class="num" value="${+a.objetivo||""}" placeholder="10.000"></div>
      ${id?"":`<div class="f"><label for="aSal">Saldo actual (€)</label><input id="aSal" inputmode="decimal" class="num" placeholder="0,00"></div>`}
      <div class="actions">${id?`<button type="button" class="btn danger" id="aDel">Borrar</button>`:""}<div class="r"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Guardar</button></div></div>
    </form>`, wrap=>{
      wrap.querySelector("#fA").onsubmit=async e=>{ e.preventDefault(); if(needReal())return;
        const obj=parseAmount(wrap.querySelector("#aObj").value||"0");
        const rec={...a, nombre:wrap.querySelector("#aNom").value.trim(), objetivo:isFinite(obj)?obj:0, historial:[...(a.historial||[])]};
        if(!id){ const s=parseAmount(wrap.querySelector("#aSal").value); if(isFinite(s)) rec.historial.push({fecha:todayISO(),saldo:s}); }
        closeSheet(); await store.set("ahorros", id||newId(), rec); toast("Cuenta guardada");
      };
      const del=wrap.querySelector("#aDel"); del && (del.onclick=async()=>{ if(needReal())return; closeSheet(); await store.del("ahorros",id); toast("Cuenta borrada"); });
    });
}

function sheetSaldo(id){
  const a=data().ahorros[id];
  openSheet(`<h3>${esc(a.nombre)}</h3>
    <form id="fS">
      <div class="f"><label for="sSal">Saldo de hoy (€)</label><input id="sSal" class="amount-in num" inputmode="decimal" placeholder="${String(saldoActual(a)).replace(".",",")}" required></div>
      <p class="note">Mira el saldo en la app de Revolut y escríbelo aquí. Así ves cuánto has ahorrado cada mes, incluidos los intereses y lo que ingresas como autónomo.</p>
      <div class="actions"><div class="r"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Guardar</button></div></div>
    </form>`, wrap=>{
      wrap.querySelector("#fS").onsubmit=async e=>{ e.preventDefault(); if(needReal())return;
        const s=parseAmount(wrap.querySelector("#sSal").value); if(!isFinite(s)){toast("Escribe un saldo válido");return;}
        const hoy=todayISO(); const h=(a.historial||[]).filter(x=>x.fecha!==hoy); h.push({fecha:hoy,saldo:s});
        closeSheet(); await store.set("ahorros", id, {...a, historial:h.slice(-120)}); toast("Saldo actualizado");
      };
    });
}

function parseLines(text){
  const out=[];
  text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const p=line.split("|").map(s=>s.trim()); if(p.length<2) return;
    let fecha = (p[0].match(/\d{4}-\d{2}-\d{2}/)||[])[0];
    if(!fecha){ const m=p[0].match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(m){ const y=m[3].length===2?"20"+m[3]:m[3]; fecha=`${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; } }
    const imp=parseAmount(p[1]); if(!fecha||!(imp>0)) return;
    const comercio=(p[2]||"").trim();
    out.push({key:"atj-"+hash(line), fecha, importe:imp, comercio, categoria:categorize(comercio), origen:"atajo"});
  });
  return out;
}
function sheetImport(){
  openSheet(`<h3>Importar pagos del atajo</h3>
    <div class="f"><label for="iFile">Archivo gastos.txt (iCloud Drive → Atajos)</label><input id="iFile" type="file" accept=".txt,text/plain"></div>
    <div class="f"><label for="iTxt">O pega aquí las líneas</label><textarea id="iTxt" placeholder="2026-11-20T13:42:10+01:00|12,50 €|Mercadona"></textarea></div>
    <p class="note" id="iInfo">Una línea por pago: fecha|importe|comercio.</p>
    <div class="actions"><button type="button" class="btn ghost small" data-close style="margin-right:auto">Cancelar</button><button class="btn" id="iGo">Importar</button></div>`, wrap=>{
      const txt=wrap.querySelector("#iTxt"), info=wrap.querySelector("#iInfo");
      const preview=()=>{ const items=parseLines(txt.value); const nuevos=items.filter(i=>!state.gastos[i.key]); info.textContent = items.length? `${items.length} pagos leídos · ${nuevos.length} nuevos`:"Una línea por pago: fecha|importe|comercio."; };
      txt.addEventListener("input",preview);
      wrap.querySelector("#iFile").onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ txt.value=String(r.result); preview(); }; r.readAsText(f); };
      wrap.querySelector("#iGo").onclick=async()=>{ if(needReal())return;
        const nuevos=parseLines(txt.value).filter(i=>!state.gastos[i.key]);
        if(!nuevos.length){ toast("No hay pagos nuevos que importar"); return; }
        closeSheet();
        for (const n of nuevos){ const {key,...rec}=n; await store.set("gastos", key, rec); }
        toast(`${nuevos.length} pagos importados`); go("gastos");
      };
    });
}

function sheetSettings(){
  const c=data().config;
  openSheet(`<h3>Ajustes</h3>
    <form id="fC">
      <div class="f"><label for="cNom">Nómina neta al mes (€)</label><input id="cNom" class="num" inputmode="decimal" value="${+c.nomina?String(c.nomina).replace(".",","):""}" placeholder="0,00"></div>
      <p class="note">Lo que cobras como autónomo va a tu cuenta de ahorro, así que no lo pongas aquí: se ve en Ahorro cuando actualizas el saldo.</p>
      <div class="actions"><button type="button" class="btn ghost small" data-goto-atajo style="margin-right:auto">Cómo crear el atajo</button><div class="r"><button type="button" class="btn ghost" data-close>Cerrar</button><button class="btn">Guardar</button></div></div>
    </form>
    <div class="bk"><div class="label" style="width:100%">Copia de seguridad</div>
      <button type="button" class="btn ghost small" id="bkOut">Descargar copia</button>
      <label class="btn ghost small" for="bkIn" style="display:inline-block">Restaurar copia</label><input id="bkIn" type="file" accept=".json,application/json" hidden>
      <p class="note" style="width:100%;margin:4px 0 0">Tus datos viven solo en este iPhone. Guarda la copia en iCloud Drive para no perderlos si borras la app o cambias de móvil.</p></div>`, wrap=>{
      wrap.querySelector("#bkOut").onclick=()=>{ if(needReal())return; const blob=new Blob([JSON.stringify({app:"mis-cuentas",v:1,fecha:todayISO(),config:state.config,fijos:state.fijos,gastos:state.gastos,ahorros:state.ahorros},null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="mis-cuentas-"+todayISO()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); };
      wrap.querySelector("#bkIn").onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.app!=="mis-cuentas") throw 0; Object.assign(state,{config:d.config||{},fijos:d.fijos||{},gastos:d.gastos||{},ahorros:d.ahorros||{},mode:"real"}); localStorage.setItem("mc.data.v1",JSON.stringify({config:state.config,fijos:state.fijos,gastos:state.gastos,ahorros:state.ahorros})); closeSheet(); render(); toast("Copia restaurada"); }catch(err){ toast("Ese archivo no es una copia de Mis Cuentas"); } }; r.readAsText(f); };
      wrap.querySelector("[data-goto-atajo]").onclick=()=>{closeSheet();go("atajo");};
      wrap.querySelector("#fC").onsubmit=async e=>{ e.preventDefault(); if(needReal())return;
        const n=parseAmount(wrap.querySelector("#cNom").value||"0");
        closeSheet(); await store.setConfig({...(state.config||{}), nomina:isFinite(n)?n:0}); toast("Ajustes guardados");
      };
    });
}

boot();
})();
